name: Game report
description: Report how a game runs with this build of ampr-emu-ng (MaxPack's fork), working or not, without naming it. English or Spanish.
title: "[Game report] Format, loader: short result"
labels: ["test report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Reports that a game works are just as useful as crash reports.
        This is MaxPack's fork of ampr-emu-ng. A problem that also happens with quer3q's
        build belongs to [upstream](https://github.com/quer3q/ampr-emu-ng).
        One game per issue.

        **You don't need to name the game.** MaxPack's
        [compatibility list](https://github.com/DeLFuS77/maxpack-ps5/blob/main/docs/compatibility.md)
        identifies games only by their numbers (sizes, volumes and setup), with no game name and no
        title ID, so please leave both out of the title, the fields and the description.

  - type: input
    id: sizes
    attributes:
      label: Original → .p5z (or folder)
      description: The game's size before and after packing, in GiB.
      placeholder: "69.0 → 33.2 GiB"

  - type: dropdown
    id: format
    attributes:
      label: Format
      description: How the game is on the drive.
      options:
        - p5z (played without installing, with MaxPack for the console)
        - zstd folder
        - LZ4 folder
        - pkg (debug FPKG)
        - plain folder (unpacked)
        - Other (say which below, e.g. an .ffpkg image)
    validations:
      required: true

  - type: input
    id: volumes
    attributes:
      label: Volumes
      description: For a .p5z, how many volumes it has (`maxpack info` on the PC shows it). Leave empty for the other formats.
      placeholder: "9"

  - type: dropdown
    id: drive
    attributes:
      label: Drive
      description: Where the game is. Say how it is connected below when it matters (an M.2 SSD in a USB-C enclosure is a USB SSD).
      options:
        - Internal SSD
        - M.2 SSD (console slot)
        - USB SSD
        - USB HDD
        - Other (say which below)
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Console firmware
      description: Settings > System > System Software.
      placeholder: "13.60"
    validations:
      required: true

  - type: input
    id: loader
    attributes:
      label: Loader/mounter and version
      description: The one that mounted the game, e.g. MaxPack 1.0.0 or ShadowMountPlus 1.7beta12.
      placeholder: "ShadowMountPlus 1.7beta12"
    validations:
      required: true

  - type: input
    id: fakelib
    attributes:
      label: Fakelib mode
      description: MaxPack's Fakelib setting on the game's sheet (Full, Emulators only or Off), or the loader's own mode for the game (and, with ShadowMountPlus, whether fakelib updates are off).
      placeholder: "Full"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ampr-emu-ng version
      description: 'The launch notification shows it, e.g. "ampr-emu-ng: v0.5.1 (p5z) running" (the upstream part of the release name, v0.5.1-maxpack.1) or, for a beta, "v0.5.1-beta.abc1234". For a test build, name the zip.'
      placeholder: "v0.5.1-maxpack.1"
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - release (libSceAmpr.sprx)
        - debug (libSceAmpr-debug.sprx renamed)
    validations:
      required: true

  - type: dropdown
    id: packs
    attributes:
      label: Packs
      description: The mode in the launch notification.
      options:
        - p5z (zstd volumes read from a .p5z)
        - zstd
        - lz4
        - pkg
        - plain (no packs)
        - no notification shown
    validations:
      required: true

  - type: input
    id: packer
    attributes:
      label: Packer and version
      placeholder: "MaxPack 1.0.0, ps5-dump-forge x.y"

  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works (played past the first level load)
        - Fails at launch ("Something went wrong" or similar)
        - Crashes later
        - Hangs (loading screen or black screen)
        - Runs, but slow or stutters
        - Other
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Date of the test
      description: The real date, YYYY-MM-DD (the clock of an offline console is often years behind).
      placeholder: "2026-11-24"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what you saw, with no game name or title ID. Where it fails, any error code. Does the same dump run without packs, or with v0.2.0?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag the files into this box. Please attach files rather than pasting their contents.
      placeholder: |
        Use the debug build: take libSceAmpr-debug.sprx from the release, rename it to
        libSceAmpr.sprx and put it in the game's fakelib/ in place of the release one.

        Crash or failed launch: copy /data/ampr_emu_trace.txt off the console BEFORE you
        launch the game again (each start rewrites it).

        Game still running (works, hangs, slow): save these pages and attach them:
          curl http://<ps5-ip>:9090/metrics > metrics.txt
          curl http://<ps5-ip>:9090/fsfail  > fsfail.txt
          curl http://<ps5-ip>:9090/modules > modules.txt

        "Something went wrong" right at launch: also attach /data/shadowmount/debug.log.
        If ampr_emu_trace.txt did not change, the runtime never loaded.
