# Host tests, release + debug .sprx builds, draft releases on v* tags and
# the beta pre-release on every push to main.
name: build

on:
  # Every push to a branch runs the host tests, except one that only changes
  # docs (Actions minutes are limited). The .sprx build runs only where a PRX
  # is needed (see the sprx job). A v* tag always builds (GitHub never applies
  # path filters to tags) and releases.
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run; a
# tag's run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    env:
      # Same toolchain as ps5/Dockerfile and crates/ampr-zstd rust-version.
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: host-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  sprx:
    name: build sprx
    # The Docker build only where a PRX is used: main (the beta), v* tags (the
    # release), a manual run, and ng-* branches (PRX builds vendored by
    # maxpack-ps5). Other branches and pull requests get the host tests only.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v')
      || startsWith(github.ref, 'refs/heads/ng-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            out/cargo-home/registry
            out/cargo-home/git
          key: sprx-cargo-${{ hashFiles('Cargo.lock', 'ps5/Dockerfile') }}
          restore-keys: sprx-cargo-
      # Main builds are betas: the launch notice reads v<version>-beta.<sha>.
      - name: make dist (Docker)
        run: ./ps5/build-docker.sh dist ${{ github.ref == 'refs/heads/main' && 'AMPR_BETA=1' || '' }}
      - name: sha256
        run: sha256sum libSceAmpr.sprx libSceAmpr-debug.sprx | tee SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: sprx
          path: |
            libSceAmpr.sprx
            libSceAmpr-debug.sprx
            SHA256SUMS
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, sprx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sprx
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum -c SHA256SUMS
          # Notes start at the last stable release, not at the beta tag,
          # which already points at this commit.
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
            --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --draft \
            --generate-notes \
            ${prev:+--notes-start-tag "$prev"} \
            libSceAmpr.sprx libSceAmpr-debug.sprx SHA256SUMS

  # One pre-release, tag `beta`, updated in place on every push to main: a
  # fixed download URL, the "Latest" badge stays on the last v* release, and
  # release watchers are not notified per push. Runs on main share the
  # workflow concurrency group (a newer push cancels the older run), so an
  # older build never lands last.
  # The tag moves through GITHUB_TOKEN, which starts no new workflow run.
  beta:
    name: beta
    # Publication day: put back if: github.ref == 'refs/heads/main'
    if: false # CI: publishes nothing while the repository is private
    needs: [test, sprx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sprx
      - name: Update beta pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          sha256sum -c SHA256SUMS
          gh api -X PATCH "repos/$REPO/git/refs/tags/beta" -f sha="$SHA" -F force=true >/dev/null \
            || gh api "repos/$REPO/git/refs" -f ref=refs/tags/beta -f sha="$SHA" >/dev/null
          prev=$(gh release list --repo "$REPO" --exclude-drafts \
            --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          {
            echo "⚠️ That's an automatic beta version intended for testing purposes."
            echo "Built automatically on each push to main branch."
            echo
            echo "It may be untested on a console, can break games and not intended to be used as a general way - just testing."
            echo
            echo "Changes since $prev: https://github.com/$REPO/compare/$prev...$SHA"
          } > notes.md
          gh release view beta --repo "$REPO" >/dev/null 2>&1 \
            || gh release create beta --repo "$REPO" --verify-tag --prerelease \
                 --latest=false --title beta --notes-file notes.md
          gh release upload beta --repo "$REPO" --clobber \
            libSceAmpr.sprx libSceAmpr-debug.sprx SHA256SUMS
          gh release edit beta --repo "$REPO" --prerelease --latest=false \
            --title "beta ${SHA::7}" --notes-file notes.md
