[package]
name = "ampr-format"
version = "0.5.1"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[dependencies]
# The shared zstd pack convention (`no_std`).
ampr-zstd.path = "../ampr-zstd"
# CRC-32 of index payloads (slice-by-16 without std, instead of a byte
# table). Already in the build through ampr-zstd, so no new crate; pinned
# and `default-features = false` as there.
crc32fast = { version = "=1.5.5", default-features = false }

[dev-dependencies]
# tests/p5z_grown.rs decodes the packed files of a real .p5z with the zstd
# chunk decoder the PS5 uses. A path crate of the workspace, nothing new.
ampr-codec.path = "../ampr-codec"
